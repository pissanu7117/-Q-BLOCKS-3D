<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080c2b"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="q-blocks-icon.png"><title>Q BLOCKS 3D</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#273181,#080c2b 68%);color:#fff;font-family:system-ui,sans-serif;touch-action:manipulation}.app{max-width:520px;margin:auto;padding:12px 12px 30px}header{text-align:center}h1{font-size:clamp(30px,8vw,48px);margin:4px 0;color:#5be9ff;text-shadow:0 3px #1944ac,0 0 15px #4cdbff;letter-spacing:1px}h1 b{color:#ffd43c;text-shadow:0 3px #b85806}small{color:#c4d5ff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat,.panel{background:linear-gradient(150deg,#1d2770,#090f37);border:2px solid #41cfff;border-radius:13px;box-shadow:0 0 12px #169eff66,inset 0 2px 8px #ffffff1a;text-align:center;padding:7px}.stat span{display:block;font-size:12px;color:#c6d7ff}.stat strong{font-size:23px;color:#ffe43c}.game{display:flex;gap:9px;justify-content:center;align-items:flex-start}.boardwrap{width:min(72%,320px);border:3px solid #50dcff;border-radius:10px;box-shadow:0 0 17px #2acbff8c;background:#050b24;overflow:hidden}canvas{display:block;width:100%;height:auto;touch-action:none}.side{width:26%;display:grid;gap:9px}.panel{padding:6px}.panel h3{font-size:12px;margin:0 0 4px}.preview{width:100%;height:auto}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}button{border:2px solid #77edff;border-radius:14px;background:linear-gradient(#298dff,#1049c5);color:white;font-weight:900;font-size:22px;padding:12px 4px;box-shadow:inset 0 2px #ffffff77,0 5px #061a63;cursor:pointer;touch-action:manipulation}button:active{transform:translateY(3px);box-shadow:inset 0 2px #ffffff77,0 2px #061a63}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;font-size:15px;background:linear-gradient(#7e44f9,#4a1bb1)}.hint{text-align:center;font-size:12px;line-height:1.7;color:#c8d4ff;margin:14px 0}.overlay{position:fixed;inset:0;background:#02071cbb;display:flex;align-items:center;justify-content:center;z-index:4}.modal{max-width:330px;width:90%;text-align:center;background:linear-gradient(#243c9a,#0a1245);border:2px solid #57eaff;box-shadow:0 0 30px #2a99ff;border-radius:20px;padding:25px}.modal h2{color:#ffdf36}.modal button{width:100%}.hidden{display:none}@media(max-width:370px){.app{padding:8px}.stats{gap:4px}.stat strong{font-size:19px}.side{gap:5px}.controls{gap:5px}button{padding:9px 3px}}
.themebar{margin-top:14px;padding:12px;border:2px solid var(--edge,#41cfff);border-radius:14px;background:var(--panel,#131d55)}.theme-title{font-weight:800;font-size:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;gap:5px}.theme-title span,.theme-title label{font-size:11px;color:#d4e4ff}.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}.themebtn{padding:8px 3px;font-size:11px;border-radius:10px;border-color:#ffffff70;background:linear-gradient(150deg,var(--t1),var(--t2));box-shadow:inset 0 2px #ffffff55,0 3px #0007}.themebtn.selected{border-color:white;outline:2px solid var(--edge,#41cfff)}.spark{position:fixed;pointer-events:none;z-index:5;font-size:27px;animation:spark .5s ease-out forwards}@keyframes spark{to{opacity:0;transform:translateY(-45px) scale(1.7)}}body{--edge:#41cfff;--panel:#131d55}body[data-theme="classic"]{background:linear-gradient(#444,#111);--edge:#b8b8b8;--panel:#292929}body[data-theme="purple"]{background:radial-gradient(ellipse at top,#632386,#1a092e 70%);--edge:#e78aff;--panel:#3a1459}body[data-theme="gold"]{background:radial-gradient(ellipse at top,#554424,#0c0b0e 70%);--edge:#e5bd5c;--panel:#29241b}body[data-theme="fire"]{background:radial-gradient(ellipse at top,#8a2524,#240911 70%);--edge:#ff9b4a;--panel:#501b25}body[data-theme="mint"]{background:radial-gradient(ellipse at top,#157b70,#072b32 70%);--edge:#7dffe1;--panel:#14554e}body[data-theme]:not([data-theme="blue"]) .boardwrap,body[data-theme]:not([data-theme="blue"]) .stat,body[data-theme]:not([data-theme="blue"]) .panel{border-color:var(--edge);box-shadow:0 0 12px color-mix(in srgb,var(--edge) 30%,transparent)}@media(max-width:370px){.themes{gap:5px}.themebtn{font-size:10px}}
</style><main class="app"><header><h1><b>Q</b> BLOCKS 3D</h1><small>⚡ NEON RETRO ARCADE ⚡</small></header><section class="stats"><div class="stat"><span>SCORE</span><strong id="score">0</strong></div><div class="stat"><span>LEVEL</span><strong id="level">1</strong></div><div class="stat"><span>BEST</span><strong id="best">0</strong></div></section><div class="game"><div class="boardwrap"><canvas id="board" width="300" height="600"></canvas></div><aside class="side"><div class="panel"><h3>NEXT</h3><canvas id="next" class="preview" width="96" height="100"></canvas></div><div class="panel"><h3>HOLD</h3><canvas id="hold" class="preview" width="96" height="100"></canvas></div><button id="holdBtn" style="font-size:14px">เก็บชิ้น</button></aside></div><div class="controls"><button id="left">◀</button><button id="rotate">⟳</button><button id="down">▼</button><button id="right">▶</button></div><section class="themebar"><div class="theme-title">🎨 เลือกธีมเกม <span>จำธีมล่าสุดอัตโนมัติ</span></div><div class="themes" id="themes"></div><div class="theme-title">✨ เอฟเฟกต์ <label><input type="checkbox" id="effects" checked> เปิดประกายลบแถว</label></div></section><div class="actions"><button id="drop">⬇ วางทันที</button><button id="pause">⏸ พักเกม</button><button id="restart">↻ เริ่มใหม่</button></div><p class="hint">ปัดซ้าย–ขวาเพื่อเลื่อน • แตะสนามเพื่อหมุน • ปัดลงเพื่อวางเร็ว<br>เกมเล่นคนเดียว ไม่ต้องต่ออินเทอร์เน็ตหลังเปิดหน้าเกม</p></main><div id="overlay" class="overlay"><div class="modal"><h2 id="modalTitle">Q BLOCKS 3D</h2><p id="modalText">เรียงบล็อกให้เต็มแถวเพื่อทำคะแนน!</p><button id="play">▶ เริ่มเล่น</button></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),cv=$('board'),cx=cv.getContext('2d'),nx=$('next').getContext('2d'),hx=$('hold').getContext('2d');const W=10,H=20,S=30,shapes={I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]},colors={I:'#3cecff',O:'#ffdd34',T:'#ba64ff',S:'#6cff4b',Z:'#ff5177',J:'#367dff',L:'#ff982f'};let grid,active,queue=[],held=null,holdUsed=false,score=0,lines=0,level=1,playing=false,paused=false,ended=false,last=0,acc=0,raf=0;const themes={blue:{label:'🔵 นีออน',bg:'#060d2d',grid:'#233768',colors},classic:{label:'◼ คลาสสิก',bg:'#191919',grid:'#454545',colors:{I:'#d0d0d0',O:'#8b8b8b',T:'#b8b8b8',S:'#747474',Z:'#a4a4a4',J:'#5f5f5f',L:'#dedede'}},purple:{label:'🟣 ม่วงชมพู',bg:'#200c35',grid:'#54316a',colors:{I:'#ed77ff',O:'#ff9adc',T:'#b67bff',S:'#e64de3',Z:'#ff5a9c',J:'#8956dc',L:'#ffd1f5'}},gold:{label:'🟡 ดำทอง',bg:'#16130d',grid:'#403722',colors:{I:'#f5cb60',O:'#ffe49d',T:'#b88c35',S:'#e6bd50',Z:'#b99d70',J:'#ad8737',L:'#f8d57c'}},fire:{label:'🔴 ไฟแดง',bg:'#270e16',grid:'#6b2632',colors:{I:'#ffb24c',O:'#ffe66a',T:'#ff603c',S:'#ffa44c',Z:'#ff335a',J:'#e35d37',L:'#ff8b32'}},mint:{label:'🟢 มิ้นต์',bg:'#062e2b',grid:'#23635b',colors:{I:'#91ffe2',O:'#c6fff0',T:'#49d9bd',S:'#5dffbd',Z:'#24b6a4',J:'#5ccac8',L:'#c4f5bd'}}};let theme=localStorage.getItem('qblocks-theme')||'blue';if(!themes[theme])theme='blue';let effects=localStorage.getItem('qblocks-effects')!=='off';$('effects').checked=effects;$('effects').onchange=e=>{effects=e.target.checked;localStorage.setItem('qblocks-effects',effects?'on':'off')};const themebox=$('themes');Object.entries(themes).forEach(([key,t])=>{const b=document.createElement('button');b.className='themebtn';b.textContent=t.label;b.style.setProperty('--t1',t.colors.I);b.style.setProperty('--t2',t.bg);b.onclick=()=>{theme=key;localStorage.setItem('qblocks-theme',key);applyTheme();draw();drawPreviews()};b.dataset.key=key;themebox.append(b)});function applyTheme(){document.body.dataset.theme=theme;themebox.querySelectorAll('button').forEach(b=>b.classList.toggle('selected',b.dataset.key===theme))}applyTheme();let best=Number(localStorage.getItem('qblocks-best')||0);$('best').textContent=best.toLocaleString();
function bag(){let a=Object.keys(shapes);for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}queue.push(...a)}function clone(m){return m.map(r=>r.slice())}function spawn(type){if(!type){if(queue.length<7)bag();type=queue.shift()}let m=clone(shapes[type]);active={type,m,x:Math.floor((W-m[0].length)/2),y:0};if(collide(active.x,active.y,m))gameOver();drawPreviews()}function collide(x,y,m){return m.some((row,dy)=>row.some((v,dx)=>v&&(x+dx<0||x+dx>=W||y+dy>=H||(y+dy>=0&&grid[y+dy][x+dx]))))}function move(dx,dy){if(!playing||paused||ended)return false;if(!collide(active.x+dx,active.y+dy,active.m)){active.x+=dx;active.y+=dy;draw();return true}if(dy)lock();return false}function rotate(){if(!playing||paused||ended)return;let m=active.m[0].map((_,i)=>active.m.map(r=>r[i]).reverse());for(let shift of [0,-1,1,-2,2])if(!collide(active.x+shift,active.y,m)){active.x+=shift;active.m=m;draw();return}}function lock(){active.m.forEach((r,dy)=>r.forEach((v,dx)=>{if(v&&active.y+dy>=0)grid[active.y+dy][active.x+dx]=active.type}));let cleared=0;for(let y=H-1;y>=0;y--)if(grid[y].every(Boolean)){grid.splice(y,1);grid.unshift(Array(W).fill(null));cleared++;y++}if(cleared){if(effects){let e=document.createElement('div');e.className='spark';e.textContent='✨ +'+cleared+' แถว';let r=cv.getBoundingClientRect();e.style.left=(r.left+r.width/3)+'px';e.style.top=(r.top+r.height/2)+'px';document.body.append(e);setTimeout(()=>e.remove(),550)}lines+=cleared;score+=([0,100,300,500,800][cleared])*level;level=1+Math.floor(lines/10);update()}holdUsed=false;spawn();draw()}function hardDrop(){if(!playing||paused||ended)return;let n=0;while(!collide(active.x,active.y+1,active.m)){active.y++;n++}score+=n*2;update();lock()}function hold(){if(!playing||paused||ended||holdUsed)return;let t=active.type;if(held)spawn(held);else spawn();held=t;holdUsed=true;drawPreviews();draw()}function update(){$('score').textContent=score.toLocaleString();$('level').textContent=level;if(score>best){best=score;localStorage.setItem('qblocks-best',String(best));$('best').textContent=best.toLocaleString()}}function block(c,x,y,s,context){let g=context.createLinearGradient(x,y,x+s,y+s);g.addColorStop(0,'#ffffff');g.addColorStop(.14,c);g.addColorStop(.75,c);g.addColorStop(1,'#101d60');context.fillStyle=g;context.fillRect(x+1,y+1,s-2,s-2);context.strokeStyle='#ffffff88';context.lineWidth=1.2;context.strokeRect(x+2,y+2,s-4,s-4);context.fillStyle='#ffffff44';context.fillRect(x+4,y+3,s-8,3)}function draw(){cx.fillStyle=themes[theme].bg;cx.fillRect(0,0,300,600);cx.strokeStyle=themes[theme].grid;cx.lineWidth=.6;for(let x=0;x<=W;x++){cx.beginPath();cx.moveTo(x*S,0);cx.lineTo(x*S,600);cx.stroke()}for(let y=0;y<=H;y++){cx.beginPath();cx.moveTo(0,y*S);cx.lineTo(300,y*S);cx.stroke()}grid.forEach((r,y)=>r.forEach((t,x)=>{if(t)block(themes[theme].colors[t],x*S,y*S,S,cx)}));if(active){let ghost=active.y;while(!collide(active.x,ghost+1,active.m))ghost++;active.m.forEach((r,y)=>r.forEach((v,x)=>{if(v){cx.fillStyle='#ffffff26';cx.fillRect((active.x+x)*S+3,(ghost+y)*S+3,S-6,S-6);block(themes[theme].colors[active.type],(active.x+x)*S,(active.y+y)*S,S,cx)}}))}}function preview(context,type){context.clearRect(0,0,96,100);if(!type)return;let m=shapes[type],size=21,x0=(96-m[0].length*size)/2,y0=(100-m.length*size)/2;m.forEach((r,y)=>r.forEach((v,x)=>{if(v)block(themes[theme].colors[type],x0+x*size,y0+y*size,size,context)}))}function drawPreviews(){if(queue.length<1)bag();preview(nx,queue[0]);preview(hx,held)}function show(title,body,button){$('modalTitle').textContent=title;$('modalText').textContent=body;$('play').textContent=button;$('overlay').classList.remove('hidden')}function gameOver(){ended=true;playing=false;show('GAME OVER','คะแนน '+score.toLocaleString()+' • ทำได้ '+lines+' แถว','↻ เล่นอีกครั้ง')}function start(){cancelAnimationFrame(raf);grid=Array.from({length:H},()=>Array(W).fill(null));queue=[];held=null;holdUsed=false;score=0;lines=0;level=1;playing=true;paused=false;ended=false;acc=0;last=0;bag();spawn();update();draw();$('overlay').classList.add('hidden');$('pause').textContent='⏸ พักเกม';raf=requestAnimationFrame(frame)}function frame(t){if(!playing||paused)return;if(!last)last=t;acc+=Math.min(100,t-last);last=t;if(acc>=Math.max(85,850*Math.pow(.82,level-1))){acc=0;move(0,1)}raf=requestAnimationFrame(frame)}function pause(){if(!playing||ended)return;paused=!paused;if(paused){cancelAnimationFrame(raf);show('พักเกม','พร้อมแล้วกดเล่นต่อ','▶ เล่นต่อ')}else{last=0;$('overlay').classList.add('hidden');raf=requestAnimationFrame(frame)}$('pause').textContent=paused?'▶ เล่นต่อ':'⏸ พักเกม'}$('play').onclick=()=>paused?pause():start();$('restart').onclick=start;$('pause').onclick=pause;$('left').onclick=()=>move(-1,0);$('right').onclick=()=>move(1,0);$('down').onclick=()=>{if(move(0,1)){score++;update()}};$('rotate').onclick=rotate;$('drop').onclick=hardDrop;$('holdBtn').onclick=hold;let startPt=null;cv.addEventListener('pointerdown',e=>{startPt={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointerup',e=>{if(!startPt)return;let dx=e.clientX-startPt.x,dy=e.clientY-startPt.y;startPt=null;if(Math.abs(dx)<18&&Math.abs(dy)<18)rotate();else if(dy>45&&Math.abs(dy)>Math.abs(dx))hardDrop();else if(Math.abs(dx)>20)move(Math.sign(dx),0)});document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')move(-1,0);if(e.key==='ArrowRight')move(1,0);if(e.key==='ArrowDown')move(0,1);if(e.key==='ArrowUp')rotate();if(e.key===' ')hardDrop();if(e.key.toLowerCase()==='c')hold()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing&&!paused)pause()});grid=Array.from({length:H},()=>Array(W).fill(null));draw();drawPreviews()})();
</script></html>
