html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{height:100dvh;touch-action:none}

.joy-pair{display:grid;grid-template-columns:1fr 1fr;gap:7px}

.joy-pair .drop-btn{background:linear-gradient(#ffb64d,#df5a11);border-color:#ffe49d}
.actions{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0 0}
.actions button{font-size:clamp(12px,1.8dvh,16px);height:clamp(36px,5dvh,45px);padding:3px}
.themebar{display:none!important}
.settings-overlay{position:fixed;inset:0;background:#000b;z-index:12;display:flex;
align-items:center;justify-content:center;padding:20px}

.settings-head button{font-size:18px;padding:4px 10px}

#themeSelect{width:100%;padding:12px;font-size:16px;border-radius:12px;

.settings-note{font-size:12px;color:#cad8ee;text-align:center}
